<!DOCTYPE html>
<html lang="en">
<head>
<meta property="og:title" content="Scarab Index — curated index of Egyptology resources">
<meta property="og:description" content="A curated index of Egyptology resources — dig in by level, topic, or keyword.">
<!-- <meta property="og:image" content="https://bbmane.github.io/event-horizon/path/to/some-image.png"> -->
<meta property="og:url" content="https://bbmane.github.io/scarab-index/">
<meta name="twitter:card" content="summary_large_image">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪲</text></svg>">
<title>Scarab Index</title>
<style>
:root{
  --bg:#f5efe2; --surface:#fffdf8; --ink:#241b0f; --ink-soft:#6b5c43;
  --accent:#a8762a; --accent-2:#6b8f71; --border:#e3d6ba;
  --badge-beg:#6b8f71; --badge-int:#c08a2e; --badge-exp:#9c4f4f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15120c; --surface:#1e1a12; --ink:#ede3cf; --ink-soft:#b2a488;
    --accent:#d7a753; --accent-2:#8fb897; --border:#352c1c;
  }
}
:root[data-theme="dark"]{
  --bg:#15120c; --surface:#1e1a12; --ink:#ede3cf; --ink-soft:#b2a488;
  --accent:#d7a753; --accent-2:#8fb897; --border:#352c1c;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{
  margin:0; height:100%; background:var(--bg); color:var(--ink);
  font-family:"Iowan Old Style","Georgia",serif;
  -webkit-font-smoothing:antialiased;
}
header{
  position:sticky; top:0; top:env(safe-area-inset-top,0px);
  background:var(--bg); border-bottom:1px solid var(--border);
  padding:1.4rem 1.2rem 1rem; z-index:10;
}
h1{margin:0; font-size:1.7rem; letter-spacing:.02em; display:flex; align-items:center; gap:.5rem;}
.sub{margin:.2rem 0 1rem; color:var(--ink-soft); font-size:.92rem;}
.controls{display:flex; flex-wrap:wrap; gap:.6rem; align-items:center;}
input[type="search"]{
  flex:1; min-width:180px; padding:.55rem .8rem; border-radius:8px;
  border:1px solid var(--border); background:var(--surface); color:var(--ink);
  font-family:inherit; font-size:.95rem;
}
.tabs{display:flex; gap:.4rem; flex-wrap:wrap;}
.tab{
  padding:.45rem .85rem; border-radius:999px; border:1px solid var(--border);
  background:var(--surface); color:var(--ink-soft); cursor:pointer; font-size:.85rem;
  font-family:inherit; transition:all .15s;
}
.tab.active{background:var(--accent); color:#fff8ec; border-color:var(--accent);}
main{padding:1.2rem; max-width:980px; margin:0 auto;}
.count{color:var(--ink-soft); font-size:.85rem; margin:0 0 .8rem;}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:.9rem;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:1rem; display:flex; flex-direction:column; gap:.5rem;
}
.card h3{margin:0; font-size:1.05rem; line-height:1.3;}
.card h3 a{color:var(--ink); text-decoration:none; border-bottom:1px dotted var(--accent);}
.card h3 a:hover{color:var(--accent);}
.badges{display:flex; flex-wrap:wrap; gap:.3rem;}
.badge{font-size:.7rem; padding:.18rem .55rem; border-radius:6px; font-family:system-ui,sans-serif; text-transform:uppercase; letter-spacing:.03em;}
.badge.beginner{background:color-mix(in srgb, var(--badge-beg) 20%, transparent); color:var(--badge-beg);}
.badge.intermediate{background:color-mix(in srgb, var(--badge-int) 20%, transparent); color:var(--badge-int);}
.badge.expert{background:color-mix(in srgb, var(--badge-exp) 20%, transparent); color:var(--badge-exp);}
.badge.kind{background:var(--border); color:var(--ink-soft);}
.badge.maps{background:color-mix(in srgb, var(--accent-2) 22%, transparent); color:var(--accent-2);}
.cat{font-size:.78rem; color:var(--ink-soft); font-style:italic;}
.desc{font-size:.88rem; line-height:1.5; color:var(--ink); flex:1;}
.empty{text-align:center; color:var(--ink-soft); padding:3rem 1rem;}
footer{text-align:center; color:var(--ink-soft); font-size:.78rem; padding:2rem 1rem calc(1.5rem + env(safe-area-inset-bottom,0px));}
</style>
</head>
<body>
<header>
  <h1>🪲 ScarabIndex</h1>
  <p class="sub">A curated index of Egyptology resources — dig in by level, topic, or keyword.</p>
  <div class="controls">
    <input type="search" id="search" placeholder="Search title, topic, description…">
    <div class="tabs" id="levelTabs"></div>
  </div>
</header>
<main>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">No resources match your filters.</div>
</main>
<footer>ScarabIndex · data lives in this page, nothing is sent anywhere.</footer>

<script>
const resources = /*__RESOURCES_JSON__*/[];

const levels = [["all","All"],["beginner","Beginner"],["intermediate","Intermediate"],["expert","Expert"]];
let activeLevel = "all";

const tabsEl = document.getElementById("levelTabs");
levels.forEach(([val,label])=>{
  const b = document.createElement("button");
  b.className = "tab" + (val==="all" ? " active" : "");
  b.textContent = label;
  b.dataset.level = val;
  b.onclick = () => { activeLevel = val; render(); updateTabs(); };
  tabsEl.appendChild(b);
});
function updateTabs(){
  [...tabsEl.children].forEach(b => b.classList.toggle("active", b.dataset.level === activeLevel));
}

const searchEl = document.getElementById("search");
searchEl.addEventListener("input", render);

function render(){
  const q = searchEl.value.trim().toLowerCase();
  const filtered = resources.filter(r=>{
    const levelOk = activeLevel==="all" || r.levels.includes(activeLevel);
    const text = (r.title+" "+r.description+" "+r.category+" "+r.kind).toLowerCase();
    const searchOk = !q || text.includes(q);
    return levelOk && searchOk;
  });
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const count = document.getElementById("count");
  count.textContent = filtered.length + (filtered.length===1 ? " resource" : " resources");
  grid.innerHTML = "";
  empty.style.display = filtered.length ? "none" : "block";
  filtered.forEach(r=>{
    const card = document.createElement("div");
    card.className = "card";
    const titleHtml = r.url
      ? `<a href="${r.url}" target="_blank" rel="noopener">${r.title} ↗</a>`
      : r.title;
    card.innerHTML = `
      <h3>${titleHtml}</h3>
      <div class="badges">
        ${r.levels.map(l=>`<span class="badge ${l}">${l}</span>`).join("")}
        <span class="badge kind">${r.kind}</span>
        ${r.hasMapsOrTimeline ? '<span class="badge maps">maps/timeline</span>' : ""}
      </div>
      <div class="cat">${r.category}</div>
      <div class="desc">${r.description}</div>
    `;
    grid.appendChild(card);
  });
}
render();
</script>
</body>
</html>
